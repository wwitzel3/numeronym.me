server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # The page is a single self-contained document, so it must always be fresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Anything that isn't a real file is a word to abbreviate (/kubernetes -> k8s),
    # so fall back to the app and let it read the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
