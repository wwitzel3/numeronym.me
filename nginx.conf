server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pyodide ships ~17MB of wasm/data; compress what we can on the wire.
    gzip on;
    gzip_types text/css application/javascript application/wasm application/json text/x-python;
    gzip_min_length 1024;

    # Vendored runtime files never change under the same path; cache hard.
    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Anything that isn't a real file is a word to abbreviate (/kubernetes -> k8s),
    # so fall back to the app and let it read the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
